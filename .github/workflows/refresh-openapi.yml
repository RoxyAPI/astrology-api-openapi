name: Refresh OpenAPI spec

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-openapi
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the live spec
        run: |
          curl -fsS --retry 3 https://roxyapi.com/api/v2/openapi.json -o fetched.json
          jq -e '.openapi and (.paths | length > 0)' fetched.json > /dev/null
          mv fetched.json openapi.json

      - name: Commit when changed
        run: |
          if git diff --quiet -- openapi.json; then
            echo 'spec unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi.json
          git commit -m 'Update openapi.json from the live spec'
          git push
